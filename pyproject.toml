[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ran-ai"
version = "0.1.0"
description = "RAN KPI data preparation and forecasting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "lightgbm>=4.7",
    "matplotlib>=3.7",
    "mlflow>=2.10",
    "numpy>=1.24",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "pyarrow>=12.0",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
