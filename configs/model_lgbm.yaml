target_column: prb_utilization
model_output: models/lgbm.joblib
tracking_uri: sqlite:///mlruns/mlflow.db
experiment_name: ranai-lte-forecast

hyperparameters:
  objective: regression
  n_estimators: 500
  learning_rate: 0.05
  num_leaves: 31
  random_state: 42

training:
  validation_fraction: 0.2
  early_stopping_rounds: 50
  random_state: 42

forecast:
  horizon_steps: 24
  seasonal_period_steps: 168

anomaly:
  residual_window: 168
  threshold_quantile: 0.99
